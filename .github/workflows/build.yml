name: Build GF2 Wiki

# Tự build APK (Android) và bản Windows mỗi khi push code lên nhánh main,
# hoặc bấm "Run workflow" trong tab Actions. Không chạy khi chỉ sửa dữ liệu dịch.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/**'
      - '**.md'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo thư mục nền tảng
        run: |
          flutter create --platforms=android --org com.locbem --project-name gf2_wiki .
          dart run tool/patch_platforms.dart

      - run: flutter pub get

      - name: Kiểm tra code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      # Tách APK theo kiến trúc CPU cho nhẹ (đa số điện thoại dùng arm64-v8a).
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: gf2-wiki-android
          path: build/app/outputs/flutter-apk/*-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo thư mục nền tảng
        run: |
          flutter create --platforms=windows --org com.locbem --project-name gf2_wiki .
          dart run tool/patch_platforms.dart

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: gf2-wiki-windows
          path: build/windows/x64/runner/Release/

  # Gắn APK + bản Windows (zip) vào release có sẵn (tag "Translate") để có link
  # tải cố định. Chỉ thêm/thay đúng các file do workflow này tạo ra, không đụng
  # tới tiêu đề, mô tả hay các file khác đang có trong release.
  release:
    name: Gắn file vào Release
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Đổi tên và nén
        run: |
          mkdir out
          for f in dist/gf2-wiki-android/*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "out/gf2-wiki-$abi.apk"
          done
          mv dist/gf2-wiki-windows dist/GF2Wiki
          (cd dist && zip -qr ../out/gf2-wiki-windows.zip GF2Wiki)
          ls -la out

      - name: Tải file lên release "Translate"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload Translate out/* --clobber
