name: gf2_wiki
description: "GF2 Exilium Wiki - ứng dụng xem wiki offline, hỗ trợ tiếng Trung và tiếng Việt."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  html: ^0.15.4
  crypto: ^3.0.5
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_widget_from_html_core: ^0.17.4
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  media_kit: ^1.2.3
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Từ điển thuật ngữ dự phòng (bản mới nhất được tải từ data/vi trên GitHub).
    - assets/game_dict.json
